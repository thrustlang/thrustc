[build]
rustc-wrapper = "sccache"

rustflags = [
    "-A", "missing_abi",
    "-A", "dead_code",
    "-A", "clippy::enum_variant_names",
    "-A", "elided_lifetimes_in_paths",
    "-A", "clippy::new_without_default"
]

[alias]
fuzz-llvm-unstable = "fuzz run llvm-codegen -- -dict=fuzz/thrust-unstable.dict"
fuzz-pipeline-unstable = "fuzz run pipeline -- -dict=fuzz/thrust-unstable.dict"

fuzz-llvm-stable = "fuzz run llvm-codegen -- -dict=fuzz/thrust-stable.dict"
fuzz-pipeline-stable = "fuzz run pipeline -- -dict=fuzz/thrust-stable.dict"

docs = "doc --workspace --no-deps --document-private-items --exclude clang --exclude inkwell --exclude inkwell_internals --exclude llvm-sys --exclude clang-sys"
docs-open = "doc --workspace --no-deps --document-private-items --open --exclude clang --exclude inkwell --exclude inkwell_internals --exclude llvm-sys --exclude clang-sys"

[lints.clippy]
style     = "allow"
complexity = "allow"
pedantic  = "allow"
new_without_default = "allow"
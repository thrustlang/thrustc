name: Thrust Compiler - Development (Windows x86_64)

on:
  push:
    tags:
      - 'thrustc-x86_64-windows-msvc-dev-v*.*.*'

jobs:
  thrustc-x86_64-windows-msvc:
    runs-on: windows-latest

    permissions:
      contents: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Generating Unique ID
        shell: pwsh
        run: |
          $BASE_NAME = "${env:GITHUB_REF}" -replace '^refs/tags/',''
          
          $VERSION = $BASE_NAME -replace '^thrustc-x86_64-windows-msvc-dev-',''
          $BUILD_ID = "${BASE_NAME}-${env:GITHUB_RUN_ID}"

          echo "BUILD_ID=$BUILD_ID" >> $env:GITHUB_ENV
          echo "TAG_NAME=$BASE_NAME" >> $env:GITHUB_ENV
          echo "VERSION=$VERSION" >> $env:GITHUB_ENV

          echo "Unique ID: $BUILD_ID"
          echo "Version: $VERSION"

      - name: Checking Out Tagged Thrust Compiler
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
          path: thrustc

      - name: Setting up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: thrustc/lsp/vscode/package-lock.json

      - name: Packaging VS Code Extension
        run: |
          npm ci
          npx --no-install vsce package
        working-directory: thrustc/lsp/vscode

      - name: Reading Changelog
        shell: pwsh
        run: |
          $CHANGELOG_PATH = "thrustc/changelogs/${{ env.TAG_NAME }}/README.md"

          if (-Not (Test-Path $CHANGELOG_PATH)) {
            Write-Host "::error::No changelog found for tag '${{ env.TAG_NAME }}'. A changelog must exist at $CHANGELOG_PATH before releasing a compiler version."
            exit 1
          }

          $CHANGELOG_CONTENT = Get-Content $CHANGELOG_PATH -Raw

          "CHANGELOG<<EOF" >> $env:GITHUB_ENV
          $CHANGELOG_CONTENT >> $env:GITHUB_ENV
          "EOF" >> $env:GITHUB_ENV

          echo "Version changelog loaded successfully."

      - name: Setup MSVC
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: x64

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest

      - name: Installing dependencies
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://sh.rustup.rs -OutFile rustup-init.sh
          ./rustup-init.sh -y
          $env:PATH += ";$env:USERPROFILE\.cargo\bin"

      - name: Cache LLVM build
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ${{ env.APPDATA }}\.thrustlang\backends\llvm\build\
          key: llvm-17-static-libclang-x86_64-windows-msvc
          restore-keys: |
            llvm-17-static-libclang-x86_64-windows-msvc-

      - name: Cloning the Compiler Dependency Builder
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/thrustlang/compiler-dependency-builder

      - name: Running the Compiler Dependency Builder
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          cargo run -- --llvm-major 17 `
            --llvm-minor 0 `
            --llvm-patch 6 `
            --llvm-config-arg "-DLIBCLANG_BUILD_STATIC=ON" `
            --llvm-config-arg "-DBUILD_SHARED_LIBS=OFF" `
            --llvm-config-arg "-DLLVM_BUILD_LLVM_DYLIB=OFF" `
            --llvm-config-arg "-DLLVM_LINK_LLVM_DYLIB=OFF" `
            --llvm-config-arg "-DCLANG_LINK_CLANG_DYLIB=OFF" `
            --llvm-c-compiler "cl" `
            --llvm-cpp-compiler "cl" `
            --llvm-config-arg "-DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded"

        working-directory: compiler-dependency-builder

      - name: Inspecting LLVM libclang build outputs (diagnostic)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $LlvmBuild = Join-Path $env:APPDATA '.thrustlang/backends/llvm/build'
          $LibDir = Join-Path $LlvmBuild 'lib'
          $BinDir = Join-Path $LlvmBuild 'bin'
          Write-Host "LLVM build dir: $LlvmBuild"
          Write-Host "Exists build: $(Test-Path $LlvmBuild) | lib: $(Test-Path $LibDir) | bin: $(Test-Path $BinDir)"
          if (-not (Test-Path $LlvmBuild)) {
            Write-Host '::warning::LLVM build dir missing.'
            exit 0
          }
          Write-Host '--- lib/libclang*.lib ---'
          Get-ChildItem -Path $LibDir -File -Filter 'libclang*.lib' -ErrorAction SilentlyContinue | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host '--- lib/clang*.lib (count + top 20) ---'
          $clangLibs = @(Get-ChildItem -Path $LibDir -File -Filter 'clang*.lib' -ErrorAction SilentlyContinue)
          Write-Host "count=$($clangLibs.Count)"
          $clangLibs | Select-Object -First 20 Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host '--- lib/LLVM*.lib (count + total bytes) ---'
          $llvmLibs = @(Get-ChildItem -Path $LibDir -File -Filter 'LLVM*.lib' -ErrorAction SilentlyContinue)
          $total = ($llvmLibs | Measure-Object -Property Length -Sum).Sum
          Write-Host "count=$($llvmLibs.Count) totalBytes=$total"
          $llvmLibs | Select-Object -First 20 Name, Length | Format-Table -AutoSize | Out-String | Write-Host
          Write-Host '--- bin/llvm-config.exe + bin/libclang.dll ---'
          foreach ($f in @((Join-Path $BinDir 'llvm-config.exe'), (Join-Path $BinDir 'libclang.dll'), (Join-Path $LibDir 'libclang.dll'))) {
            Write-Host "$f exists=$(Test-Path $f)"
          }
          $llvmConfig = Join-Path $BinDir 'llvm-config.exe'
          if (Test-Path $llvmConfig) {
            try {
              & $llvmConfig --version
              (& $llvmConfig --libs) | Select-Object -First 1 | ForEach-Object { $_.Substring(0, [Math]::Min(2000, $_.Length)) } | Write-Host
            } catch {
              Write-Host "::warning::llvm-config failed: $($_.Exception.Message)"
            }
          }
          exit 0

      - name: Installing and Configuring Build Cache
        run: |
          cargo install sccache
        working-directory: thrustc

      - name: Building Thrust Compiler (Development)
        run: |
          cargo build -p thrustc
        working-directory: thrustc

      - name: Building Thrust LSP (Development)
        run: |
          cargo build -p thrustc_lsp
        working-directory: thrustc

      - name: Building Stripped Development Binaries
        shell: pwsh
        run: |
          cargo build --profile release-stripped -p thrustc -p thrustc_lsp
          Move-Item target/release-stripped/thrustc.exe target/release-stripped/thrustc-stripped.exe
          Move-Item target/release-stripped/thrustc_lsp.exe target/release-stripped/thrustc_lsp-stripped.exe
        working-directory: thrustc

      - name: Releasing Thrust Compiler
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.TAG_NAME }}
          body: |
            <p align="center">
              <img src= "https://github.com/thrustlang/.github/blob/main/assets/logos/new%20logo/thrustlang-logo-banner-text-italic.png" alt= "logo" style= "width: 1hv; height: 1hv;"> </img>
            </p>

            # Thrust Compiler - Development

            <img src= "https://github.com/thrustlang/.github/blob/main/assets/standard-text-separator.png" alt= "standard-separator" style= "width: 1hv;"> </img>

            Version: ${{ env.VERSION }}

            ## Backends
            
            ### LLVM

            Architecture targets for which the compiler was compiled.
            
            - ``x86_64``
            - ``AArch64``
            - ``RISC-V``
            - ``ARM``
            - ``MIPS``
            - ``PowerPC``
            - ``SystemZ``
            - ``AMDGPU``
            - ``Hexagon``
            - ``Lanai``
            - ``LoongArch``
            - ``MSP430``
            - ``NVPTX``
            - ``SPARC``
            - ``XCore``
            - ``BPF``
            - ``SPIR-V``
            - ``WebAssembly``

            ${{ env.CHANGELOG }}

          files: |
            thrustc/target/debug/thrustc.exe
            thrustc/target/debug/thrustc_lsp.exe
            thrustc/target/release-stripped/thrustc-stripped.exe
            thrustc/target/release-stripped/thrustc_lsp-stripped.exe
            thrustc/lsp/vscode/thrustlang-vscode-*.vsix
          draft: false
          fail_on_unmatched_files: true
          prerelease: true

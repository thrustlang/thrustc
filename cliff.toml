[changelog]
header = """
# Changelog\n
All notable changes to the Thrust Compiler (thrustc) are documented here.\n
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking %} [**BREAKING**]{% endif %} \
([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/thrustlang/thrustc/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
footer = """
---
*Generated by [git-cliff](https://github.com/orhun/git-cliff)*
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false

commit_parsers = [
  { message = "^\\(feat\\(llvm_backend\\).*\\)", group = "Features", scope = "llvm_backend" },
  { message = "^\\(feat\\(gcc_backend\\).*\\)", group = "Features", scope = "gcc_backend" },
  { message = "^\\(feat\\(frontend\\).*\\)",     group = "Features", scope = "frontend" },
  { message = "^\\(feat\\(project\\).*\\)",      group = "Features", scope = "project" },
  { message = "^\\(.*fix.*\\)",                  group = "Bug Fixes" },
  { message = "^\\(.*feat.*\\)",                 group = "Features" },

  { message = "^feat\\(llvm_backend\\)",   group = "Features",      scope = "llvm_backend" },
  { message = "^feat\\(gcc_backend\\)",    group = "Features",      scope = "gcc_backend" },
  { message = "^feat\\(frontend\\)",       group = "Features",      scope = "frontend" },
  { message = "^feat\\(project-visual\\)", group = "Documentation", scope = "project-visual" },
  { message = "^feat\\(project\\)",        group = "Project",       scope = "project" },

  { message = "^fix\\(llvm_backend\\)", group = "Bug Fixes", scope = "llvm_backend" },
  { message = "^fix\\(gcc_backend\\)",  group = "Bug Fixes", scope = "gcc_backend" },
  { message = "^fix\\(frontend\\)",     group = "Bug Fixes", scope = "frontend" },

  { message = ".*", skip = true },
]

commit_preprocessors = [
  { pattern = "^Merge .*", replace = "" },
]

filter_commits = true
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "newest"
link_parsers = [
  { pattern = "#(\\d+)", href = "https://github.com/thrustlang/thrustc/issues/$1" },
]